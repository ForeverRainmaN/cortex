ember-config {
    host = 0.0.0.0
    port = 4041
}

postgres-config {
    n-threads = 32
    url = "jdbc:postgresql://localhost:5432/cortex"
    user = "docker"
    password = "docker"
}

security-config {
    jwt-secret = ${?CORTEX_JWT_SECRET}
    access-token-expiry = "15 minutes"
    refresh-token-expiry = "30 days"
}
